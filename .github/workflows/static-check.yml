name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:static
