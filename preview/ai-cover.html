<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>西洋楼铜版图 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 390px;
    height: 844px;
    overflow: hidden;
    background: #F4EDDC;
    color: #46382A;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .screen {
    position: relative;
    width: 390px;
    height: 844px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 180px 120px at 16% 12%, rgba(122, 92, 62, 0.07), transparent 70%),
      radial-gradient(ellipse 200px 150px at 90% 72%, rgba(122, 92, 62, 0.06), transparent 70%),
      repeating-linear-gradient(0deg, rgba(122, 92, 62, 0.03) 0 1px, transparent 1px 7px),
      radial-gradient(ellipse at center, transparent 58%, rgba(90, 70, 46, 0.08) 100%),
      linear-gradient(165deg, #F6F0E0 0%, #F4EDDC 55%, #EFE5CE 100%);
  }
  .binder {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 16px;
    z-index: 4;
    border-right: 1px solid rgba(138, 122, 96, 0.22);
    background:
      radial-gradient(circle at 8px 7px, #46382A 0 1.2px, transparent 1.5px),
      radial-gradient(circle at 8px 7px, transparent 2.6px, rgba(168, 154, 132, 0.9) 3px, transparent 4.4px),
      linear-gradient(90deg, rgba(222, 209, 180, 0.45), transparent);
    background-size: 100% 28%, 100% 28%, 100% 100%;
    background-repeat: no-repeat;
    background-position: 0 12%, 0 14%, 0 0;
    box-shadow: inset 0 0 0 0;
  }
  .binder::before, .binder::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 34%;
    background:
      radial-gradient(circle at 8px 8px, #46382A 0 1.2px, transparent 1.5px),
      radial-gradient(circle at 8px 16px, #46382A 0 1.2px, transparent 1.5px),
      radial-gradient(circle at 8px 8px, transparent 2.6px, rgba(168, 154, 132, 0.9) 3px, transparent 4.4px),
      radial-gradient(circle at 8px 16px, transparent 2.6px, rgba(168, 154, 132, 0.9) 3px, transparent 4.4px);
  }
  .binder::before { top: 18%; }
  .binder::after { top: 62%; }
  .page {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 54px 18px 22px 28px;
  }
  .tag {
    position: absolute;
    top: 62px;
    right: 18px;
    width: 46px;
    height: 78px;
    background: #F7F0DF;
    border: 1px solid rgba(122, 92, 62, 0.35);
    box-shadow: 0 2px 6px rgba(70, 56, 42, 0.18);
    transform: rotate(3deg);
    z-index: 6;
    text-align: center;
    padding-top: 28px;
    font-family: "STSong", "SimSun", serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: #7A5C3E;
  }
  .tag::before {
    content: "";
    position: absolute;
    top: 8px; left: 50%;
    width: 8px; height: 8px;
    margin-left: -4px;
    border: 1px solid rgba(122, 92, 62, 0.45);
    border-radius: 50%;
  }
  .hero { position: relative; flex: 0 0 250px; }
  .perfo {
    height: 210px;
    margin-right: 28px;
    padding: 10px;
    background:
      radial-gradient(circle at 6px 6px, #F4EDDC 4px, transparent 4.5px),
      #FBF7EC;
    background-size: 14px 14px;
    border: 1px solid rgba(70, 56, 42, 0.4);
    box-shadow: 0 3px 10px rgba(70, 56, 42, 0.16);
    transform: rotate(-1.2deg);
    position: relative;
  }
  .tape {
    position: absolute;
    left: 22px; top: -6px;
    width: 72px; height: 16px;
    background: rgba(111, 114, 72, 0.32);
    transform: rotate(-4deg);
    z-index: 3;
  }
  .photo {
    position: relative;
    height: 100%;
    overflow: hidden;
    background: #EBE1CB;
    border: 1px solid rgba(70, 56, 42, 0.28);
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: sepia(0.24) saturate(0.72) contrast(1.04);
    display: block;
  }
  .corner {
    position: absolute;
    width: 12px; height: 12px;
    border: 1px solid #A98F5F;
    z-index: 2;
  }
  .corner.tl { left: 6px; top: 6px; border-right: 0; border-bottom: 0; }
  .corner.tr { right: 6px; top: 6px; border-left: 0; border-bottom: 0; }
  .corner.bl { left: 6px; bottom: 6px; border-right: 0; border-top: 0; }
  .corner.br { right: 6px; bottom: 6px; border-left: 0; border-top: 0; }
  .note {
    position: absolute;
    left: 8px; bottom: 0;
    z-index: 4;
    transform: rotate(-2deg);
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 13px;
    color: #8A7A60;
  }
  .stamp {
    position: absolute;
    right: 36px; top: 156px;
    z-index: 5;
    width: 58px; height: 58px;
    border: 1.5px solid rgba(166, 58, 46, 0.75);
    border-radius: 50%;
    color: rgba(166, 58, 46, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 9px;
    line-height: 1.35;
    letter-spacing: 1px;
    transform: rotate(-8deg);
    background: rgba(166, 58, 46, 0.04);
  }
  .stamp span {
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(166, 58, 46, 0.45);
    border-radius: 50%;
  }
  .hatch {
    height: 8px;
    margin: 8px 28px 0 0;
    background: repeating-linear-gradient(90deg, rgba(70, 56, 42, 0.35) 0 8px, transparent 8px 12px);
    opacity: 0.55;
  }
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 6px;
  }
  .arch {
    width: 72px; height: 32px;
    border: 1px solid rgba(70, 56, 42, 0.45);
    border-bottom: 0;
    border-radius: 72px 72px 0 0;
    margin-bottom: 10px;
  }
  .title {
    font-family: "STSong", "SimSun", serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #2E1F0D;
  }
  .title-line {
    margin-top: 8px;
    width: 150px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(169, 143, 95, 0.75), transparent);
  }
  .seal {
    margin-top: 10px;
    width: 72px; height: 72px;
    background: #A63A2E;
    border-radius: 4px;
    box-shadow: inset 0 0 0 2px rgba(247, 244, 236, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: rotate(-3deg);
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 18px;
    line-height: 1.15;
    color: #F4EDDC;
  }
  .torn {
    height: 10px;
    margin-right: 8px;
    background:
      linear-gradient(45deg, #EBE1CB 0 5px, transparent 5px),
      linear-gradient(-45deg, #EBE1CB 0 5px, transparent 5px);
    background-size: 12px 10px;
    background-repeat: repeat-x;
  }
  .ticket-wrap { position: relative; margin: 0 8px 8px 0; }
  .ticket {
    background: #EBE1CB;
    border: 1px solid rgba(70, 56, 42, 0.35);
    border-bottom: 0;
    padding: 14px 16px 12px;
    text-align: center;
  }
  .meta {
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: #7A5C3E;
    margin-bottom: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 168px;
    min-height: 40px;
    padding: 8px 18px;
    border: 1.5px solid #A63A2E;
    color: #A63A2E;
    background: transparent;
    font-family: "STSong", "SimSun", serif;
    font-size: 16px;
    letter-spacing: 4px;
    border-radius: 3px;
  }
  .edge {
    height: 8px;
    background-image: radial-gradient(circle at 6px 0, transparent 5px, #EBE1CB 5.5px);
    background-size: 14px 8px;
    background-repeat: repeat-x;
  }
  .foot {
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #8A7A60;
    padding: 8px 0 4px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="binder"></div>
    <div class="page">
      <div class="tag">No.000</div>
      <div class="hero">
        <div class="perfo">
          <div class="tape"></div>
          <div class="photo">
            <img src="../plate21/module/assets/img/IMG-RUNTIME-COVER.jpg" alt="">
            <i class="corner tl"></i>
            <i class="corner tr"></i>
            <i class="corner bl"></i>
            <i class="corner br"></i>
          </div>
        </div>
        <div class="note">闻有第二十一图，未见。</div>
        <div class="stamp"><span></span>乾隆四十六年<br>1781</div>
        <div class="hatch"></div>
      </div>
      <div class="middle">
        <div class="arch"></div>
        <div class="title">西洋楼铜版图</div>
        <div class="title-line"></div>
        <div class="seal">第二十<br>一图</div>
      </div>
      <div class="torn"></div>
      <div class="ticket-wrap">
        <div class="ticket">
          <div class="meta">考察凭证 · 第貳拾壹號</div>
          <div class="btn">开始考察</div>
        </div>
        <div class="edge"></div>
      </div>
      <div class="foot">考察手册</div>
    </div>
  </div>
</body>
</html>
